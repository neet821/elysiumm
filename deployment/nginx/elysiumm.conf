# Install this file as /etc/nginx/sites-available/elysium.
# The TLS certificate paths are deliberately operator-provided.
server {
    listen 80;
    listen [::]:80;
    server_name elysiumm.top www.elysiumm.top;
    return 301 https://elysiumm.top$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name elysiumm.top www.elysiumm.top;

    ssl_certificate /etc/letsencrypt/live/elysiumm.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elysiumm.top/privkey.pem;
    root /srv/services/elysium/frontend-current/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~ ^/api/transfers/[^/]+$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        client_max_body_size 2g;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /uploads/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /media/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /_elysiumm_live_auth {
        internal;
        proxy_pass http://127.0.0.1:8000/api/live/authorize-media;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /live-media/ {
        auth_request /_elysiumm_live_auth;
        proxy_pass http://127.0.0.1:8888/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_redirect ~^/(.*)$ /live-media/$1;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sync.elysiumm.top;

    ssl_certificate /etc/letsencrypt/live/elysiumm.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elysiumm.top/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:5984;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
