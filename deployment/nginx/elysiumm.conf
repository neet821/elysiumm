# Install this file as /etc/nginx/sites-available/elysiumm.
# The TLS certificate paths are deliberately operator-provided.
server {
    listen 80;
    listen [::]:80;
    server_name elysiumm.top www.elysiumm.top;
    return 301 https://elysiumm.top$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name elysiumm.top www.elysiumm.top;

    ssl_certificate /etc/letsencrypt/live/elysiumm.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elysiumm.top/privkey.pem;
    root /var/www/elysiumm;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /uploads/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /mineradio/ {
        proxy_pass http://127.0.0.1:18181/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /mineradio-api/ {
        proxy_pass http://127.0.0.1:18181/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /live-media/ {
        proxy_pass http://127.0.0.1:8888/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /socket.io/ {
        proxy_pass http://127.0.0.1:8000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sync.elysiumm.top;

    ssl_certificate /etc/letsencrypt/live/elysiumm.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elysiumm.top/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:5984;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
