# Install alongside the main site config after the send.elysiumm.top
# certificate has been issued.
server {
    listen 80;
    listen [::]:80;
    server_name send.elysiumm.top;
    return 301 https://send.elysiumm.top$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name send.elysiumm.top;

    ssl_certificate /etc/letsencrypt/live/send.elysiumm.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/send.elysiumm.top/privkey.pem;
    root /srv/services/elysium/frontend-current/dist;
    index index.html;

    location ~ ^/api/transfers/[^/]+$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        client_max_body_size 2g;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
