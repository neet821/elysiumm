services:
  db:
    image: mariadb:10.6
    container_name: elysiumm-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:?set DB_NAME in .env}
      MYSQL_USER: ${DB_USER:?set DB_USER in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: elysiumm-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://${DB_USER:?set DB_USER in .env}:${DB_PASSWORD:?set DB_PASSWORD in .env}@db:3306/${DB_NAME:?set DB_NAME in .env}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS in .env}
      EXTERNAL_MEDIA_DOH_URL: ${EXTERNAL_MEDIA_DOH_URL:-https://cloudflare-dns.com/dns-query}
      MUSIC_PROVIDER_LEGACY_COMPAT: "0"
      MUSIC_PROVIDER_TIMEOUT_SECONDS: ${MUSIC_PROVIDER_TIMEOUT_SECONDS:-5}
      NETEASE_API_BASE_URL: ${NETEASE_API_BASE_URL:-https://music.163.com}
      QQ_API_BASE_URL: ${QQ_API_BASE_URL:-https://u.y.qq.com}
      AUDIUS_API_BASE_URL: ${AUDIUS_API_BASE_URL:-https://api.audius.co/v1}
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      DOCKER_ENV: "true"
      UPLOAD_DIR: /app/shared/uploads
      PRIVATE_STORAGE_DIR: /app/shared/private-storage
      ADMIN_FILES_STORAGE_DIR: /app/shared/private-storage/admin-files
      PUBLIC_SYNC_STORAGE: /app/shared/sync-storage
      TRANSFER_STORAGE_DIR: /app/shared/transfers
      BACKUP_OUTPUT_DIR: /app/shared/backups
      MUSIC_PROVIDER_CREDENTIAL_DIR: /app/shared/private-storage/music
    volumes:
      - shared_uploads:/app/shared/uploads
      - shared_private_storage:/app/shared/private-storage
      - shared_sync_storage:/app/shared/sync-storage
      - shared_transfers:/app/shared/transfers
      - shared_backups:/app/shared/backups
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    container_name: elysiumm-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

volumes:
  db_data:
  shared_uploads:
  shared_private_storage:
  shared_sync_storage:
  shared_transfers:
  shared_backups:

networks:
  app-network:
    driver: bridge
