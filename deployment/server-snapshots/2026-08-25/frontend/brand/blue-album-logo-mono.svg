<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Monochrome album sleeve and vinyl logo</title>
  <desc id="desc">A one-color record sleeve with three catalog lines and a partially exposed vinyl record.</desc>
  <defs>
    <style>
      :root { color: #202020; }
      @media (prefers-color-scheme: dark) { :root { color: #f4f4f2; } }
    </style>
    <mask id="record-cutouts">
      <rect width="256" height="256" fill="#fff"/>
      <g fill="none" stroke="#000" stroke-width="1.2">
        <circle cx="181" cy="128" r="59"/>
        <circle cx="181" cy="128" r="51"/>
        <circle cx="181" cy="128" r="43"/>
        <circle cx="181" cy="128" r="35"/>
        <circle cx="181" cy="128" r="27"/>
      </g>
      <circle cx="181" cy="128" r="17" fill="#000"/>
    </mask>
    <mask id="sleeve-cutouts">
      <rect width="256" height="256" fill="#fff"/>
      <g stroke="#000" stroke-width="3">
        <path d="M36 42V214"/>
        <path d="M43 42V214"/>
        <path d="M50 42V214"/>
      </g>
    </mask>
  </defs>

  <circle cx="181" cy="128" r="70" fill="currentColor" mask="url(#record-cutouts)"/>
  <rect x="28" y="42" width="154" height="172" fill="currentColor" mask="url(#sleeve-cutouts)"/>
</svg>
