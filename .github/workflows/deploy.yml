name: Elysium CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: elysium-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality and release payload
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      frontend: ${{ steps.impact.outputs.frontend }}
      backend: ${{ steps.impact.outputs.backend }}
      full: ${{ steps.impact.outputs.full }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install browser smoke dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install backend dependencies
        run: |
          set -euo pipefail
          python -m venv backend/.venv
          backend/.venv/bin/pip install -r backend/requirements-dev.txt --disable-pip-version-check

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Resolve release impact
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          elif [[ -z "${BEFORE_SHA:-}" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            base="$(git rev-list --max-parents=0 "$HEAD_SHA")"
          else
            base="$BEFORE_SHA"
          fi

          python scripts/resolve-release-impact.py --base "$base" --head "$HEAD_SHA" > release-impact.json
          frontend="$(jq -r '(.components | index("frontend")) != null' release-impact.json)"
          backend="$(jq -r '(.components | index("backend")) != null' release-impact.json)"
          full="$(jq -r '.requires_full_validation' release-impact.json)"
          {
            echo "frontend=$frontend"
            echo "backend=$backend"
            echo "full=$full"
          } >> "$GITHUB_OUTPUT"

      - name: Backend focused checks
        if: steps.impact.outputs.backend == 'true' || steps.impact.outputs.full == 'true'
        run: |
          set -euo pipefail
          backend/.venv/bin/python -m unittest discover \
            -s backend/tests -p 'test_release_*_unittest.py' -v
          backend/.venv/bin/python -m unittest discover \
            -s tests -p 'test_release_*.py' -v

      - name: Backend full checks
        if: steps.impact.outputs.backend == 'true' || steps.impact.outputs.full == 'true'
        env:
          DATABASE_URL: sqlite:////tmp/elysium-ci-${{ github.run_id }}.sqlite3
          SECRET_KEY: ci-only-${{ github.run_id }}-not-for-production
          ALLOW_PREEXISTING_SCHEMA_DRIFT: '1'
        run: |
          set -euo pipefail
          backend/.venv/bin/python -m ruff check backend tools/public-sync-agent \
            --select E9,F63,F7,F82 --exclude backend/.venv
          backend/.venv/bin/python -m compileall -q backend tools/public-sync-agent \
            -x 'backend/.venv'
          backend/.venv/bin/python -m unittest discover \
            -s backend/tests -p 'test_*_unittest.py' -v
          backend/.venv/bin/python backend/run_migrations.py

      - name: Frontend check
        if: steps.impact.outputs.frontend == 'true' || steps.impact.outputs.full == 'true'
        run: npm --prefix frontend run check

      - name: Frontend budget
        if: steps.impact.outputs.frontend == 'true' || steps.impact.outputs.full == 'true'
        run: npm --prefix frontend run check:budget

      - name: Frontend production build
        if: steps.impact.outputs.frontend == 'true' || steps.impact.outputs.full == 'true'
        run: npm --prefix frontend run build

      - name: Capture frontend budget report
        if: steps.impact.outputs.frontend == 'true' || steps.impact.outputs.full == 'true'
        run: node scripts/check-frontend-budget.mjs --json > frontend-budget.json

      - name: Record release metadata
        run: |
          set -euo pipefail
          frontend_lock_sha256="$(sha256sum frontend/package-lock.json | awk '{print $1}')"
          api_schema_sha256="$(sha256sum backend/schemas.py | awk '{print $1}')"
          {
            printf 'frontend_package_lock_sha256=%s\n' "$frontend_lock_sha256"
            printf 'frontend_api_schema_sha256=%s\n' "$api_schema_sha256"
            printf 'backend_api_schema_sha256=%s\n' "$api_schema_sha256"
            printf 'node_version=20\n'
          } > release-metadata.env

      - name: Check patch formatting
        run: git diff --check

      - name: Run the full release gate before main deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CHROME_BINARY: /usr/bin/google-chrome
        run: scripts/release-gate.sh

      - name: Upload release metadata
        uses: actions/upload-artifact@v4
        with:
          name: elysium-release-metadata-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release-impact.json
            release-metadata.env

      - name: Upload frontend release artifact
        if: steps.impact.outputs.frontend == 'true' || steps.impact.outputs.full == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: elysium-frontend-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            frontend/dist
            frontend-budget.json

  deployment:
    name: Production deployment
    needs: quality
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.quality.result == 'success' &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Download frontend release artifact
        if: needs.quality.outputs.frontend == 'true' || needs.quality.outputs.full == 'true'
        uses: actions/download-artifact@v4
        with:
          name: elysium-frontend-${{ github.sha }}
          path: release-artifact

      - name: Download release metadata
        uses: actions/download-artifact@v4
        with:
          name: elysium-release-metadata-${{ github.sha }}
          path: release-metadata

      - name: Prepare deployment payload
        env:
          DEPLOY_FRONTEND: ${{ needs.quality.outputs.frontend == 'true' || needs.quality.outputs.full == 'true' }}
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/elysium-deploy-payload"
          deploy_frontend="$DEPLOY_FRONTEND"
          mkdir -p "$payload"
          tar \
            -cf - \
            deployment \
            scripts/install-release-layout.sh \
            scripts/deploy-production.py \
            scripts/bootstrap-production.py \
            scripts/release-preflight.sh \
            scripts/verify-baseline.py \
            scripts/elysium_health_guard.py \
            | tar -xf - -C "$payload"
          mkdir -p "$payload/frontend"
          if [[ "$deploy_frontend" == true ]]; then
            cp -a release-artifact/frontend/dist "$payload/frontend/dist"
            cp release-artifact/frontend-budget.json "$payload/frontend-budget.json"
          fi
          cp release-metadata/release-impact.json "$payload/release-impact.json"
          cp release-metadata/release-metadata.env "$payload/release-metadata.env"

          archive_name="elysium-${GITHUB_SHA}-${GITHUB_RUN_ID}.tar.gz"
          tar -czf "$RUNNER_TEMP/$archive_name" -C "$payload" .
          {
            printf 'ELYSIUM_PAYLOAD=%s\n' "$RUNNER_TEMP/$archive_name"
            printf 'ELYSIUM_PAYLOAD_NAME=%s\n' "$archive_name"
          } >> "$GITHUB_ENV"

      - name: Configure pinned SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          test -n "$DEPLOY_SSH_KNOWN_HOSTS"
          key_path="$RUNNER_TEMP/elysium-deploy-key"
          known_hosts_path="$RUNNER_TEMP/elysium-known-hosts"
          umask 077
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$key_path"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$known_hosts_path"
          chmod 600 "$key_path" "$known_hosts_path"
          {
            printf 'ELYSIUM_SSH_KEY=%s\n' "$key_path"
            printf 'ELYSIUM_SSH_KNOWN_HOSTS=%s\n' "$known_hosts_path"
          } >> "$GITHUB_ENV"

      - name: Upload deployment payload
        env:
          PRODUCTION_SSH_HOST: ${{ vars.PRODUCTION_SSH_HOST }}
          PRODUCTION_SSH_USER: ${{ vars.PRODUCTION_SSH_USER }}
        run: |
          set -euo pipefail
          test -n "$PRODUCTION_SSH_HOST"
          test -n "$PRODUCTION_SSH_USER"
          scp -q \
            -i "$ELYSIUM_SSH_KEY" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$ELYSIUM_SSH_KNOWN_HOSTS" \
            -o StrictHostKeyChecking=yes \
            "$ELYSIUM_PAYLOAD" \
            "${PRODUCTION_SSH_USER}@${PRODUCTION_SSH_HOST}:/tmp/${ELYSIUM_PAYLOAD_NAME}"

      - name: Run production deployment
        env:
          PRODUCTION_SSH_HOST: ${{ vars.PRODUCTION_SSH_HOST }}
          PRODUCTION_SSH_USER: ${{ vars.PRODUCTION_SSH_USER }}
          PRODUCTION_ROOT: ${{ vars.PRODUCTION_ROOT }}
          PRODUCTION_BASELINE_ID: ${{ vars.PRODUCTION_BASELINE_ID }}
          PRODUCTION_GIT_ORIGIN: ${{ vars.PRODUCTION_GIT_ORIGIN }}
          DEPLOYMENT_ID: elysium-${{ github.sha }}-${{ github.run_id }}
          DEPLOY_COMMIT: ${{ github.sha }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
          DEPLOY_FRONTEND: ${{ needs.quality.outputs.frontend == 'true' || needs.quality.outputs.full == 'true' }}
          DEPLOY_BACKEND: ${{ needs.quality.outputs.backend == 'true' || needs.quality.outputs.full == 'true' }}
        run: |
          set -euo pipefail
          for required in PRODUCTION_SSH_HOST PRODUCTION_SSH_USER PRODUCTION_ROOT \
            PRODUCTION_BASELINE_ID PRODUCTION_GIT_ORIGIN; do
            test -n "${!required:-}" || {
              echo "missing required deployment variable: $required" >&2
              exit 1
            }
          done

          target="${PRODUCTION_SSH_USER}@${PRODUCTION_SSH_HOST}"
          ssh_options=(
            -i "$ELYSIUM_SSH_KEY"
            -o IdentitiesOnly=yes
            -o UserKnownHostsFile="$ELYSIUM_SSH_KNOWN_HOSTS"
            -o StrictHostKeyChecking=yes
          )
          ssh "${ssh_options[@]}" "$target" bash -s -- \
            "$PRODUCTION_ROOT" \
            "$PRODUCTION_BASELINE_ID" \
            "$DEPLOYMENT_ID" \
            "$DEPLOY_COMMIT" \
            "$DEPLOY_RUN_ID" \
            "$PRODUCTION_GIT_ORIGIN" \
            "/tmp/$ELYSIUM_PAYLOAD_NAME" \
            "$DEPLOY_FRONTEND" \
            "$DEPLOY_BACKEND" <<'REMOTE_SCRIPT'
          set -euo pipefail
          root="$1"
          baseline_id="$2"
          deployment_id="$3"
          commit="$4"
          run_id="$5"
          origin="$6"
          archive="$7"
          deploy_frontend="$8"
          deploy_backend="$9"

          if [[ ! "$baseline_id" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*$ ]]; then
            echo "invalid production baseline id" >&2
            exit 1
          fi
          if [[ ! "$deployment_id" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*$ ]]; then
            echo "invalid deployment id" >&2
            exit 1
          fi

          stage="$(mktemp -d "/tmp/elysium-release-${deployment_id}.XXXXXX")"
          cleanup() {
            rm -rf -- "$stage"
            rm -f -- "$archive"
          }
          trap cleanup EXIT

          tar --extract --gzip --file "$archive" --directory "$stage" --no-same-owner
          # Verify the immutable recovery point before the installer is
          # allowed to create or adjust any release-layout path.  This is
          # required for frontend-only deploys too.
          sudo -n python3 "$stage/scripts/verify-baseline.py" \
            --baseline "$root/baseline/$baseline_id"
          sudo -n bash "$stage/scripts/install-release-layout.sh" \
            --root "$root" --origin "$origin"
          sudo -n git --git-dir="$root/repository.git" fetch --no-tags origin "$commit"
          sudo -n git --git-dir="$root/repository.git" cat-file -e "$commit^{commit}"
          preflight_args=(
            --root "$root"
            --env-file /etc/elysium/backend.env
            --web-root "$root/frontend-current/dist"
            --backup-root "$root/shared/backups"
            --health-url http://127.0.0.1:8000/api/health
          )
          if [[ "$deploy_backend" != true && "$deploy_frontend" == true ]]; then
            # A frontend-only deployment does not inspect or ping the
            # production database. Backend/full deployments retain the
            # database health gate and migration analysis below.
            preflight_args+=(--skip-database)
          fi
          if [[ ! -L "$root/backend-current" || ! -L "$root/frontend-current" ]]; then
            # The first manually approved cutover has a verified baseline and
            # release layout but no component current links yet.
            preflight_args+=(--allow-empty-current)
          fi
          sudo -n bash "$stage/scripts/release-preflight.sh" "${preflight_args[@]}"
          sudo -n install -d -m 0755 "$root/deployment"
          sudo -n install -m 0644 "$stage/deployment/release-impact.yml" \
            "$root/deployment/release-impact.yml"

          deployment_python="$(command -v python3)"
          if [[ "$deploy_backend" == true ]]; then
            deployment_python=''
            for candidate in \
              "$root/backend-current/.venv/bin/python" \
              "$root/baseline/$baseline_id/backend/.venv/bin/python"; do
              if [[ -x "$candidate" ]]; then
                deployment_python="$candidate"
                break
              fi
            done
            [[ -n "$deployment_python" ]] || {
              echo "no trusted Alembic-capable Python runtime is available" >&2
              exit 1
            }
          fi

          mapfile -t changed_paths < <(
            python3 - "$stage/release-impact.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              payload = json.load(handle)
          for path in payload.get("changed_paths", []):
              if not isinstance(path, str) or not path:
                  raise SystemExit("release impact contains an invalid path")
              print(path)
          PY
          )
          if ((${#changed_paths[@]} == 0)); then
            changed_paths=(deployment/release-impact.yml)
          fi
          path_args=()
          for path in "${changed_paths[@]}"; do
            path_args+=(--path "$path")
          done

          metadata_value() {
            local key="$1"
            awk -F= -v wanted="$key" \
              '$1 == wanted {sub(/^[^=]*=/, ""); print; exit}' \
              "$stage/release-metadata.env"
          }
          frontend_lock_sha256="$(metadata_value frontend_package_lock_sha256)"
          frontend_schema_sha256="$(metadata_value frontend_api_schema_sha256)"
          backend_schema_sha256="$(metadata_value backend_api_schema_sha256)"
          for digest in "$frontend_lock_sha256" "$frontend_schema_sha256" "$backend_schema_sha256"; do
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || {
              echo "release metadata contains an invalid SHA-256" >&2
              exit 1
            }
          done

          deploy_command=(
            sudo -n "$deployment_python" "$stage/scripts/deploy-production.py"
            --root "$root"
            --commit "$commit"
            --git-ref "refs/heads/main"
            --impact-map "$stage/deployment/release-impact.yml"
            --deployment-id "$deployment_id"
            --trigger github-actions
            --github-run-id "$run_id"
            --repository "$root/repository.git"
            --frontend-package-lock-sha256 "$frontend_lock_sha256"
            --frontend-api-schema-sha256 "$frontend_schema_sha256"
            --backend-api-schema-sha256 "$backend_schema_sha256"
            --node-version "20"
          )
          if [[ "$deploy_backend" == true ]]; then
            deploy_command+=(--python "$deployment_python")
          fi
          if [[ "$deploy_frontend" == true ]]; then
            deploy_command+=(
              --frontend-dist "$stage/frontend/dist"
              --budget-json "$stage/frontend-budget.json"
            )
          fi
          for path in "${changed_paths[@]}"; do
            case "$path" in
              deployment/nginx/elysiumm.conf)
                if [[ -f "$stage/deployment/nginx/elysiumm.conf" ]]; then
                  deploy_command+=(--nginx-source "/etc/nginx/sites-available/elysiumm=$stage/deployment/nginx/elysiumm.conf")
                else
                  deploy_command+=(--remove-nginx-target /etc/nginx/sites-available/elysiumm)
                fi
                ;;
              deployment/nginx/send.elysiumm.conf)
                if [[ -f "$stage/deployment/nginx/send.elysiumm.conf" ]]; then
                  deploy_command+=(--nginx-source "/etc/nginx/conf.d/send-elysiumm.conf=$stage/deployment/nginx/send.elysiumm.conf")
                else
                  deploy_command+=(--remove-nginx-target /etc/nginx/conf.d/send-elysiumm.conf)
                fi
                ;;
              deployment/nginx-elysiumm-articles.conf)
                [[ ! -e "$stage/deployment/nginx-elysiumm-articles.conf" ]] || {
                  echo "no production replacement target is defined for legacy Articles Nginx snippet" >&2
                  exit 1
                }
                deploy_command+=(--remove-nginx-target /etc/nginx/sites-available/elysiumm-articles.conf)
                ;;
              deployment/nginx/*)
                echo "no production target is defined for changed Nginx file: $path" >&2
                exit 1
                ;;
              deployment/mediamtx/*.yml|deployment/mediamtx/*.yaml)
                if [[ -f "$stage/$path" ]]; then
                  deploy_command+=(--mediamtx-config-source "$stage/$path")
                else
                  echo "MediaMTX config cannot be deleted without an explicit rollback plan: $path" >&2
                  exit 1
                fi
                ;;
              scripts/elysium_health_guard.py)
                if [[ -f "$stage/scripts/elysium_health_guard.py" ]]; then
                  deploy_command+=(--health-guard-source "$stage/scripts/elysium_health_guard.py")
                else
                  echo "health guard source cannot be deleted without an explicit rollback plan" >&2
                  exit 1
                fi
                ;;
              deployment/systemd/*.service|deployment/systemd/*.timer)
                unit="${path#deployment/systemd/}"
                candidate_path="$stage/deployment/systemd/$unit"
                if [[ -f "$candidate_path" ]]; then
                  deploy_command+=(--systemd-source "$unit=$candidate_path")
                else
                  deploy_command+=(--remove-systemd-unit "$unit")
                fi
                ;;
              deployment/*.service|deployment/*.timer)
                unit="${path#deployment/}"
                candidate_path="$stage/deployment/$unit"
                if [[ -f "$candidate_path" ]]; then
                  deploy_command+=(--systemd-source "$unit=$candidate_path")
                else
                  deploy_command+=(--remove-systemd-unit "$unit")
                fi
                ;;
            esac
          done
          deploy_command+=("${path_args[@]}")
          "${deploy_command[@]}"
          REMOTE_SCRIPT

      - name: Remove temporary SSH material
        if: always()
        run: |
          rm -f -- "$RUNNER_TEMP/elysium-deploy-key" \
            "$RUNNER_TEMP/elysium-known-hosts"
