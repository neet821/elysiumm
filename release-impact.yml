version: 1

# Keep matching rules in one versioned file. The resolver evaluates every
# changed path against every rule and unions the selected components and
# validation profiles.
rules:
  - id: frontend-source
    paths:
      - frontend/**
    components: [frontend]
    validation: [frontend]

  - id: backend-source
    paths:
      - backend/**
    components: [backend]
    validation: [backend]

  - id: backend-dependency-locks
    paths:
      - requirements*.txt
      - requirements*.lock
      - requirements*.in
      - backend/requirements*.txt
      - backend/requirements*.lock
      - backend/requirements*.in
      - backend/pyproject.toml
      - backend/uv.lock
    components: [backend]
    validation: [dependency-lock, migration-analysis]

  - id: frontend-dependency-locks
    paths:
      - frontend/package.json
      - frontend/package-lock.json
      - frontend/pnpm-lock.yaml
      - frontend/yarn.lock
    components: [frontend]
    validation: [dependency-lock]

  - id: api-schema
    paths:
      - openapi/**
      - schemas/**
      - backend/openapi/**
      - backend/schemas.py
      - backend/config.py
      - frontend/src/config.js
      - config/**
      - shared-config/**
      - deployment/shared-config/**
    components: [backend, frontend]
    validation: [api-contract, full]

  - id: nginx-infrastructure
    paths:
      - deployment/nginx/**
      - deployment/nginx-*.conf
    components: [infra]
    validation: [nginx, frontend-smoke, backend-smoke]

  - id: mediamtx-infrastructure
    paths:
      - deployment/mediamtx/**
      - deployment/live/mediamtx.yml
      - deployment/live/elysiumm-mediamtx.service
    components: [infra]
    validation: [systemd, backend-smoke, live-smoke]

  - id: health-guard-infrastructure
    paths:
      - scripts/elysium_health_guard.py
    components: [infra]
    validation: [systemd, backend-smoke]

  - id: systemd-infrastructure
    paths:
      - deployment/systemd/**
      - deployment/*.service
      - deployment/*.timer
    components: [backend, infra]
    validation: [systemd, backend-smoke]

  - id: release-tooling
    paths:
      - scripts/release-*.sh
      - scripts/release-*.py
      - scripts/deploy-*.sh
      - scripts/deploy-*.py
      - scripts/resolve-release-impact.py
      - release-impact.yml
    components: [frontend, backend, infra]
    validation: [full]

defaults:
  components: [frontend, backend, infra]
  validation: [full]
