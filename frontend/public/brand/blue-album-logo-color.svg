<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Color album sleeve and vinyl logo</title>
  <desc id="desc">A deep blue record sleeve with three white catalog lines and a partially exposed dark vinyl record.</desc>
  <defs>
    <linearGradient id="sleeve-blue" x1="28" y1="42" x2="182" y2="214" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b3d74"/>
      <stop offset="0.52" stop-color="#174d85"/>
      <stop offset="1" stop-color="#245d94"/>
    </linearGradient>
    <radialGradient id="vinyl-black" cx="0" cy="0" r="1" gradientTransform="translate(156 94) rotate(48) scale(126)">
      <stop stop-color="#414141"/>
      <stop offset="0.62" stop-color="#252525"/>
      <stop offset="1" stop-color="#171717"/>
    </radialGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="150%" height="155%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#101820" flood-opacity="0.2"/>
    </filter>
  </defs>

  <g filter="url(#soft-shadow)">
    <circle cx="181" cy="128" r="70" fill="url(#vinyl-black)"/>
    <g fill="none" stroke="#b8b8b8" stroke-opacity="0.52" stroke-width="1.15">
      <circle cx="181" cy="128" r="59"/>
      <circle cx="181" cy="128" r="51"/>
      <circle cx="181" cy="128" r="43"/>
      <circle cx="181" cy="128" r="35"/>
      <circle cx="181" cy="128" r="27"/>
    </g>
    <circle cx="181" cy="128" r="17" fill="#f7f5f2"/>

    <rect x="28" y="42" width="154" height="172" fill="url(#sleeve-blue)"/>
    <g stroke="#ffffff" stroke-width="3" shape-rendering="geometricPrecision">
      <path d="M36 42V214"/>
      <path d="M43 42V214"/>
      <path d="M50 42V214"/>
    </g>
  </g>
</svg>
